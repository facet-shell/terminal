"$schema" = "https://starship.rs/config-schema.json"

# facet prompt, bloom style ({{name}} colors).
# Generated by `facet theme`; edit templates/bloom/starship/.config/starship.toml instead.
# Segments are round pills, like bloom's chips; where you are is the filled one:
#   ( ~/frameshell)  ( main +12 -3)            ( 3.12.4)  ( 09:41)
#   ❯
# A pill is a left cap, the content on the pill color and a right cap; the caps are
# Nerd Font half circles (, ), which Ghostty ships built in.
# Language/tool segments only show inside matching projects.

palette = "bloom"
add_newline = true

format = """
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$fill\
$python\
$conda\
$nodejs\
$bun\
$deno\
$java\
$kotlin\
$scala\
$gradle\
$c\
$cpp\
$cmake\
$rust\
$golang\
$zig\
$dotnet\
$php\
$ruby\
$lua\
$swift\
$dart\
$haskell\
$elixir\
$package\
$docker_context\
$nix_shell\
$cmd_duration\
$time\
$line_break\
$character"""

[palettes.bloom]
# Pills sit on the terminal background (surface), so one step up
pill = "{{tones.high}}"
pc = "{{tones.primaryContainer}}"
on_pc = "{{tones.onPrimaryContainer}}"
primary = "{{tones.primary}}"
secondary = "{{tones.secondary}}"
tertiary = "{{tones.tertiary}}"
text = "{{tones.text}}"
dim = "{{tones.dim}}"
ok = "{{tones.ok}}"
error = "{{tones.error}}"
warn = "{{colors.warn}}"

# ── Left side ────────────────────────────────────────────────

# The filled pill: the folder you are in
[directory]
style = "bold bg:pc fg:on_pc"
format = "[](fg:pc)[ $path]($style)[$read_only]($read_only_style)[](fg:pc) "
read_only = " "
read_only_style = "bg:pc fg:error"
truncation_length = 3
truncation_symbol = "…/"

# Git pill: branch opens it, git_status closes it (also when clean)
[git_branch]
symbol = ""
style = "bg:pill fg:primary"
format = "[](fg:pill)[$symbol $branch]($style)"

# Only shown on a detached HEAD
[git_commit]
style = "bg:pill fg:warn"
format = "[  $hash$tag]($style)"
tag_symbol = "  "

# Rebase, merge, cherry-pick … with progress
[git_state]
style = "bg:pill fg:warn"
format = "[ $state( $progress_current/$progress_total)]($style)"

[git_metrics]
disabled = false
added_style = "bg:pill fg:ok"
deleted_style = "bg:pill fg:error"
format = "([ +$added]($added_style))([ -$deleted]($deleted_style))"

[git_status]
style = "bg:pill fg:dim"
format = "[( $all_status$ahead_behind)]($style)[](fg:pill)"

# The space between left and right
[fill]
symbol = " "

# ── Right side: languages and tools ──────────────────────────
# Same pill everywhere, a space after it

[python]
symbol = ""
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version( \\($virtualenv\\))]($style)[](fg:pill) "

[conda]
symbol = " conda"
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $environment]($style)[](fg:pill) "
ignore_base = true

[nodejs]
symbol = ""
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version]($style)[](fg:pill) "

[bun]
symbol = "bun"
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version]($style)[](fg:pill) "

[deno]
symbol = "deno"
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version]($style)[](fg:pill) "

[java]
symbol = ""
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version]($style)[](fg:pill) "

[kotlin]
symbol = ""
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version]($style)[](fg:pill) "

[scala]
symbol = ""
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version]($style)[](fg:pill) "

[gradle]
symbol = "gradle"
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version]($style)[](fg:pill) "

[c]
symbol = ""
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version]($style)[](fg:pill) "

# Off by default in Starship
[cpp]
disabled = false
symbol = ""
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version]($style)[](fg:pill) "

[cmake]
symbol = "cmake"
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version]($style)[](fg:pill) "

[rust]
symbol = ""
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version]($style)[](fg:pill) "

[golang]
symbol = ""
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version]($style)[](fg:pill) "

[zig]
symbol = ""
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version]($style)[](fg:pill) "

[dotnet]
symbol = ""
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version(  $tfm)]($style)[](fg:pill) "

[php]
symbol = ""
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version]($style)[](fg:pill) "

[ruby]
symbol = ""
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version]($style)[](fg:pill) "

[lua]
symbol = ""
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version]($style)[](fg:pill) "

[swift]
symbol = ""
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version]($style)[](fg:pill) "

[dart]
symbol = ""
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version]($style)[](fg:pill) "

[haskell]
symbol = ""
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version]($style)[](fg:pill) "

[elixir]
symbol = ""
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $version]($style)[](fg:pill) "

# Version from package.json, Cargo.toml, pyproject.toml …
[package]
symbol = ""
style = "bg:pill fg:dim"
format = "[](fg:pill)[$symbol $version]($style)[](fg:pill) "

[docker_context]
symbol = ""
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $context]($style)[](fg:pill) "

[nix_shell]
symbol = ""
style = "bg:pill fg:secondary"
format = "[](fg:pill)[$symbol $state( $name)]($style)[](fg:pill) "

# ── Duration, clock, input ───────────────────────────────────

[cmd_duration]
min_time = 2000
style = "bg:pill fg:dim"
format = "[](fg:pill)[ $duration]($style)[](fg:pill) "

# Last segment, so no space after it
[time]
disabled = false
time_format = "%H:%M"
style = "bg:pill fg:dim"
format = "[](fg:pill)[$time]($style)[](fg:pill)"

[character]
success_symbol = "[❯](bold fg:primary)"
error_symbol = "[❯](bold fg:error)"
vimcmd_symbol = "[❮](bold fg:tertiary)"
